services:
  - type: web
    name: apex-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: apex-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: 60
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: MODEL_NAME
        value: gpt-4o-mini
      - key: DEBUG
        value: "false"

databases:
  - name: apex-db
    plan: free
    region: oregon
    databaseName: apex
    user: apex_user
