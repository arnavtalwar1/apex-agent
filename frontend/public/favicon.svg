  <path d="M 51 33 C 56 32 57 25 52 24 C 47 25 48 32 51 33 Z" fill="url(#fav-emerald)"/>
  <path d="M 25 21 C 21 17 22 10 27 12 C 30 16 28 20 25 21 Z" fill="url(#fav-emerald)"/>
  <path d="M 39 21 C 43 17 42 10 37 12 C 34 16 36 20 39 21 Z" fill="url(#fav-emerald)"/>

  <!-- Coral Leaves -->
  <path d="M 19 25 C 16 21 17 15 22 17 C 24 21 22 24 19 25 Z" fill="url(#fav-coral)"/>
  <path d="M 45 25 C 48 21 47 15 42 17 C 40 21 42 24 45 25 Z" fill="url(#fav-coral)"/>

  <!-- Apex Golden Leaf -->
