  <!-- Background rounded pill/circle -->
  <rect width="64" height="64" rx="16" fill="#F7F3E8"/>
  <rect width="60" height="60" x="2" y="2" rx="14" stroke="#EADBCE" stroke-width="1.5"/>

  <!-- Roots -->
  <path d="M 32 52 C 28 57 20 60 14 59 M 32 52 C 36 57 44 60 50 59" stroke="url(#fav-gold)" stroke-width="2" stroke-linecap="round"/>

  <!-- Trunk & Branches -->
